<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สแกน QR Code ผู้ป่วย</title>
  <link rel="stylesheet" href="style.css">

  <!-- Bootstrap 4.6 & Font Awesome -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- QR Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  
</head>

<body>

  <div class="scanner-card">
    
    <!-- Header -->
    <div class="scanner-header">
      <h5><i class="fas fa-qrcode mr-2"></i>กล้องสแกน QR Code ผู้ป่วย</h5>
    </div>

    <!-- Body -->
    <div class="scanner-body">
      
      <!-- Camera Reader -->
      <div id="reader"></div>

      <!-- Result Box -->
      <div class="result-box">
        <div class="result-title"><i class="fas fa-id-card mr-1"></i>ผลการสแกน HN</div>
        <div id="result">กำลังเปิดกล้อง...</div>
      </div>

      <!-- Action Button -->
      <button id="scanAgainBtn" class="btn btn-pink btn-block mt-3 py-2" style="display: none;">
        <i class="fas fa-redo mr-2"></i>สแกนใหม่อีกครั้ง
      </button>

    </div>

  </div>

  <script src="app.js"></script>

</body>

</html>
